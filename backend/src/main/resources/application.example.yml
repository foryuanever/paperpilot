server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: paperpilot-server
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 130MB
  datasource:
    url: jdbc:mysql://${PAPER_DB_HOST:127.0.0.1}:${PAPER_DB_PORT:3306}/${PAPER_DB_NAME:paper}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${PAPER_DB_USERNAME:root}
    password: ${PAPER_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  mail:
    host: ${PAPERPILOT_MAIL_HOST:}
    port: ${PAPERPILOT_MAIL_PORT:587}
    username: ${PAPERPILOT_MAIL_USERNAME:}
    password: ${PAPERPILOT_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

paperpilot:
  ai:
    openai-compatible-timeout-ms: 60000
  storage:
    mode: mysql
  translate:
    deepl-api-key: ${DEEPL_API_KEY:}
    baidu-app-id: ${BAIDU_APP_ID:}
    baidu-secret: ${BAIDU_SECRET:}
    microsoft-key: ${MICROSOFT_TRANSLATOR_KEY:}
    microsoft-region: ${MICROSOFT_TRANSLATOR_REGION:eastasia}
    tencent-secret-id: ${TENCENT_TRANSLATE_SECRET_ID:}
    tencent-secret-key: ${TENCENT_TRANSLATE_SECRET_KEY:}
    tencent-region: ${TENCENT_TRANSLATE_REGION:ap-guangzhou}
  pdfmathtranslate:
    base-url: ${PDFMATH_TRANSLATE_URL:http://127.0.0.1:11008}
  mineru:
    binary: ${MINERU_BINARY:../.mineru-venv/bin/mineru}
    model-source: ${MINERU_MODEL_SOURCE:modelscope}
  ppt-master:
    skill-dir: ${PPT_MASTER_SKILL_DIR:/Users/yuan/.codex/skills/ppt-master}
    python: ${PPT_MASTER_PYTHON:}
    codex: ${PPT_MASTER_CODEX:/Applications/Codex.app/Contents/Resources/codex}
    agent-timeout-minutes: ${PPT_MASTER_AGENT_TIMEOUT_MINUTES:120}
  payment:
    zhifufm:
      api-base-url: ${PAPERPILOT_ZHIFUFM_API_BASE_URL:}
      merchant-num: ${PAPERPILOT_ZHIFUFM_MERCHANT_NUM:}
      secret: ${PAPERPILOT_ZHIFUFM_SECRET:}
      public-base-url: ${PAPERPILOT_PUBLIC_BASE_URL:}
      notify-url: ${PAPERPILOT_ZHIFUFM_NOTIFY_URL:}
      return-url: ${PAPERPILOT_ZHIFUFM_RETURN_URL:}
      alipay-pay-type: ${PAPERPILOT_ZHIFUFM_ALIPAY_PAY_TYPE:alipay}
      wechat-pay-type: ${PAPERPILOT_ZHIFUFM_WECHAT_PAY_TYPE:wechat}
