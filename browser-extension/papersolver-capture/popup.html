<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperSolver Capture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 380px;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e5edff;
        background:
          radial-gradient(circle at 16% 0%, rgba(79, 70, 229, .22), transparent 34%),
          linear-gradient(145deg, #0f172a, #07111f);
      }

      .shell {
        padding: 16px;
      }

      .hero {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 15px;
        border: 1px solid rgba(129, 140, 248, .28);
        border-radius: 16px;
        background: rgba(15, 23, 42, .72);
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(15, 23, 42, .42);
      }

      .mark img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
      }

      #version {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(79, 70, 229, .18);
        color: #c4b5fd;
        font-size: 11px;
        font-weight: 900;
      }

      .subtitle {
        grid-column: 1 / -1;
        margin: 2px 0 0;
        color: #93a4c7;
        font-size: 12px;
        line-height: 1.55;
      }

      .account {
        margin: 12px 0;
        padding: 11px 12px;
        border: 1px solid rgba(34, 211, 238, .18);
        border-radius: 13px;
        background: rgba(8, 47, 73, .34);
        color: #a5f3fc;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.45;
      }

      .desktop-state {
        margin: 12px 0;
        padding: 12px;
        border: 1px solid rgba(129, 140, 248, .22);
        border-radius: 14px;
        background: rgba(30, 41, 59, .72);
        color: #bfdbfe;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.5;
      }

      .desktop-state.bad {
        border-color: rgba(248, 113, 113, .28);
        background: rgba(127, 29, 29, .24);
        color: #fecaca;
      }

      label {
        display: grid;
        gap: 8px;
        color: #dbeafe;
        font-size: 12px;
        font-weight: 900;
      }

      input {
        height: 42px;
        padding: 0 12px;
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: 12px;
        background: rgba(15, 23, 42, .78);
        color: #f8fafc;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: rgba(34, 211, 238, .66);
        box-shadow: 0 0 0 4px rgba(34, 211, 238, .1);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      button {
        height: 40px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      #save {
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
      }

      #test {
        border: 1px solid rgba(148, 163, 184, .26);
        background: rgba(15, 23, 42, .72);
        color: #dbeafe;
      }

      .status {
        min-height: 18px;
        margin-top: 10px;
        color: #67e8f9;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.4;
      }

      .status.error {
        color: #fca5a5;
      }

      .hint {
        margin: 10px 0 0;
        color: #93a4c7;
        font-size: 11px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="mark"><img src="icon-active-128.png" alt="" /></div>
        <div>
          <h1>PaperSolver Capture</h1>
        </div>
        <small id="version"></small>
        <p class="subtitle">只在明确论文详情页、PDF 页或已知学术来源中提示导入。</p>
      </section>

      <div id="account" class="account">尚未绑定账号。请先打开一次 PaperSolver 页面。</div>
      <div id="desktopState" class="desktop-state">正在检测桌面端本机保存服务...</div>

      <label>
        PaperSolver 后端地址
        <input id="apiBase" placeholder="http://127.0.0.1:8080" />
      </label>

      <div class="actions">
        <button id="save">保存配置</button>
        <button id="test">测试连接</button>
      </div>

      <div id="status" class="status"></div>
      <p class="hint">插件只在识别到明确的文献 PDF 全文入口时弹出，不再导入纯题录或普通下载链接。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
